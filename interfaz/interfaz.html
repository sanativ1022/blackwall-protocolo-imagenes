<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171919">
  <title>Visor BlackWall</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="visor" aria-label="Visor de imágenes grandes">
    <header class="cabecera">
      <div class="identidad">
        <svg class="marca" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4h10v10H4zM18 4h10v10H18zM4 18h10v10H4zM18 18h10v10H18z"/><path class="marca-detalle" d="M18 18h10v10H18z"/></svg>
        <span class="marca-texto"><strong>BLACKWALL</strong><small>Explorador de imágenes</small></span>
      </div>
      <label id="controlImagen" class="archivo" for="selectorImagen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg>
        <span class="archivo-etiqueta">Imagen</span>
        <select id="selectorImagen" aria-label="Seleccionar imagen"></select>
      </label>
      <div class="lectura-nivel">
        <span class="lectura-etiqueta">Escala de exploración</span>
        <output id="nivelActual" class="nivel" aria-live="polite">Nivel —</output>
      </div>
    </header>

    <div class="lienzo">
      <canvas id="visor" aria-label="Imagen: usa la rueda para acercar y arrastra para desplazarte"></canvas>
      <output id="estadoCarga" class="estado-carga" role="status" aria-live="polite">Preparando imagen…</output>
    </div>

    <footer class="herramientas" aria-label="Controles del visor">
      <p id="ayudaNavegacion" class="ayuda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7"/></svg>
        <span>Arrastra para explorar<small>Rueda para acercar</small></span>
      </p>
      <div class="zoom" role="group" aria-label="Controles de acercamiento">
        <button id="alejar" class="boton-icono" type="button" aria-label="Alejar" title="Alejar (−)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <label class="control-zoom" for="zoomNivel"><span>Zoom</span><input id="zoomNivel" type="range" min="0" max="1" value="0" aria-label="Nivel de zoom" disabled></label>
        <button id="acercar" class="boton-icono" type="button" aria-label="Acercar" title="Acercar (+)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="acciones">
        <button id="vistaGeneral" class="boton-texto" type="button" title="Volver a la vista general (0)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8"/></svg><span>Vista general</span><kbd aria-hidden="true">0</kbd></button>
        <span class="divisor" aria-hidden="true"></span>
        <button id="pantallaCompleta" class="boton-icono" type="button" aria-label="Activar pantalla completa" title="Pantalla completa (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>
    </footer>
  </main>
  <script type="module" src="aplicacion.js"></script>
</body>
</html>
